name: Build FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64

jobs:
  validate:
    name: 校验（结构 + 语法 + 后端冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 项目结构检查
        run: python tools/ci/check_project.py

      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/ci/release_notes.py --tag "$GITHUB_REF_NAME" --check-only

      - name: Python 语法检查
        run: python -m compileall -q app/web app/qqmusic_api

      - name: 安装依赖
        run: pip install -r app/requirements.txt

      - name: 后端冒烟测试
        run: python tools/ci/smoke_test.py

      - name: C 加速解密库与纯 Python 等价性校验
        run: python tools/ci/test_c_accel.py

  build:
    name: 打包 FPK
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 允许上传 Release 资产（默认 GITHUB_TOKEN 为只读）
    steps:
      - uses: actions/checkout@v4

      - name: 下载官方 fnpack
        run: |
          curl -fL -o fnpack "$FNPACK_URL"
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: 确保生命周期脚本可执行
        run: chmod +x cmd/* wizard/* 2>/dev/null || true

      - name: 读取版本号（用于资产命名）
        id: ver
        run: echo "version=$(python tools/ci/release_notes.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: 编译 QMC2 C 加速库（随包分发）
        run: |
          gcc -O2 -shared -fPIC -o app/web/libqmc2_fast.so app/web/csrc/qmc2_fast.c
          ls -l app/web/libqmc2_fast.so

      - name: 构建 .fpk
        run: |
          fnpack build --directory .
          ls -lh *.fpk

      - name: FPK 按「版本号-应用名」重命名
        run: |
          mv qqmusic-downloader.fpk "${{ steps.ver.outputs.version }}-qqmusic-downloader.fpk"
          ls -lh *.fpk

      - name: 校验产物内容
        run: python tools/ci/inspect_fpk.py "${{ steps.ver.outputs.version }}-qqmusic-downloader.fpk"

      - name: 打包源码全包（tar.gz）
        run: |
          git archive --format=tar.gz \
            --prefix="qqmusic-downloader-${{ steps.ver.outputs.version }}/" \
            -o "${{ steps.ver.outputs.version }}-qqmusic-downloader-src.tar.gz" HEAD
          ls -lh *.tar.gz

      - name: 收集产物信息
        run: ls -lh *.fpk *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: qqmusic-downloader-${{ steps.ver.outputs.version }}
          path: |
            *.fpk
            *.tar.gz
          if-no-files-found: error

      - name: 生成发行说明（含提交记录与改动统计）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python tools/ci/release_notes.py --tag "$GITHUB_REF_NAME" \
            --out release-notes.md --changelog CHANGELOG.md --readme README.md
          cat release-notes.md

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.fpk
            *.tar.gz
          body_path: release-notes.md

      - name: 回写 CHANGELOG.md 与 README 版本号
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- CHANGELOG.md README.md; then
            echo "更新日志与版本号已是最新，无需回写"
            exit 0
          fi
          git add CHANGELOG.md README.md
          git commit -m "chore(release): 同步 $GITHUB_REF_NAME 的更新日志与版本号 [skip ci]"
          git push origin HEAD:main
