name: 构建发布包（APK）

# 发版只打 tag：以前 push main 和 push tag 各触发一次，同一个提交会跑两遍。
# 需要单独验证某个分支时，用 Actions 页面的 Run workflow，或者直接开 PR。
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 校验（结构 + 语法 + 后端冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 项目结构检查
        run: python tools/ci/check_project.py

      - name: 校验 tag 与 manifest 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/ci/release_notes.py --tag "$GITHUB_REF_NAME" --check-only

      - name: Python 语法检查
        run: python -m compileall -q app/web app/qqmusic_api

      - name: 安装依赖
        run: pip install -r app/requirements.txt

      - name: 后端冒烟测试
        run: python tools/ci/smoke_test.py

  apk:
    name: 打包 APK（安卓客户端）
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: echo "version=$(python3 tools/ci/release_notes.py --print-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 固定签名：密钥以 base64 存在仓库 Secrets 里，每次构建都还原同一份，
      # 所以新版本可以直接覆盖安装旧版本（签名一致才允许升级）。
      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法产出可覆盖安装的正式包" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
          keytool -list -v -keystore "$RUNNER_TEMP/signing/release.p12" -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Alias name|SHA256"

      - name: 构建 release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: gradle --no-daemon --stacktrace assembleRelease -PappVersion="$VERSION"

      - name: 校验签名与版本号
        run: |
          set -eu
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)"
          "$BT/aapt2" dump badging "$APK" | grep -q "versionName='${{ steps.ver.outputs.version }}'"
          echo "APK 校验通过"

      - name: 按「版本号-应用名」重命名
        run: mv android/app/build/outputs/apk/release/*.apk "${{ steps.ver.outputs.version }}-qqmusic-downloader.apk"

      - name: 生成发行说明（含提交记录与改动统计）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tools/ci/release_notes.py --tag "$GITHUB_REF_NAME" \
            --out release-notes.md --changelog CHANGELOG.md --readme README.md
          cat release-notes.md

      # 每个 tag 都创建一个正式 Release；只更新当前 tag 的 Release，
      # 历史版本（旧 tag 的 Release 与资产）不会被删除或覆盖。
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QQ音乐下载器 ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: "*.apk"
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: qqmusic-downloader-${{ steps.ver.outputs.version }}
          path: "*.apk"
          retention-days: 3
