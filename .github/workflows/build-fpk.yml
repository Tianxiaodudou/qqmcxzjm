name: Build FPK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64

jobs:
  validate:
    name: 校验（结构 + 语法 + 后端冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 项目结构检查
        run: python tools/ci/check_project.py

      - name: Python 语法检查
        run: python -m compileall -q app/web app/qqmusic_api

      - name: 安装依赖
        run: pip install -r app/requirements.txt

      - name: 后端冒烟测试
        run: python tools/ci/smoke_test.py

  build:
    name: 打包 FPK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载官方 fnpack
        run: |
          curl -fL -o fnpack "$FNPACK_URL"
          chmod +x fnpack
          sudo mv fnpack /usr/local/bin/fnpack
          fnpack --help

      - name: 确保生命周期脚本可执行
        run: chmod +x cmd/* wizard/* 2>/dev/null || true

      - name: 构建 .fpk
        run: fnpack build --directory .

      - name: 校验产物内容
        run: python tools/ci/inspect_fpk.py qqmusic-downloader.fpk

      - name: 收集产物信息
        run: ls -lh *.fpk

      - uses: actions/upload-artifact@v4
        with:
          name: qqmusic-downloader-fpk
          path: '*.fpk'
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.fpk'
